[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nwrapper"
version = "0.1.0"
description = "Resumable Masscan-to-Nmap TCP service scan orchestrator."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
nwrapper = "nwrapper.cli:main"

[project.urls]
Repository = "https://github.com/w0ot-net/nwrapper"

[tool.setuptools.packages.find]
include = ["nwrapper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["nwrapper", "tests"]
